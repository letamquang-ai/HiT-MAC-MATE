name: MultiAgentTracking(16v32, 16)-Sparse
max_episode_steps: 10000
num_cargoes_per_target: 8
high_capacity_target_split: 0.5
targets_start_with_cargoes: true
bounty_factor: 1.0
shuffle_entities: true
reward_type: dense

camera:
  location_random_range:
    # 16 cameras
    - [  700,  850,  700,  850 ]
    - [  700,  850, -850, -700 ]
    - [ -850, -700, -850, -700 ]
    - [ -850, -700,  700,  850 ]

    - [  500,  600, -100,  100 ]
