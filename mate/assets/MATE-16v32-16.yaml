    - [  700,  850, -450, -300 ]
    - [  300,  450, -850, -700 ]

    - [ -450, -300, -850, -700 ]
    - [ -850, -700, -450, -300 ]
    - [ -850, -700,  300,  450 ]
    - [ -450, -300,  700,  850 ]

  min_viewing_angle: 20.0
  max_sight_range: 700.0
  rotation_step: 5.0
  zooming_step: 2.5
  radius: 20.0

